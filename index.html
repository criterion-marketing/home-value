<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>__TITLE__</title>
    <meta name="description" content="__DESCRIPTION__" />
    <meta property="og:title" content="__TITLE__" />
    <meta property="og:description" content="__DESCRIPTION__" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="__PAGE_URL__" />
    <meta property="og:image" content="__SHARE_IMAGE_URL__" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="__TITLE__" />
    <meta name="twitter:description" content="__DESCRIPTION__" />
    <meta name="twitter:image" content="__SHARE_IMAGE_URL__" />
    <link rel="canonical" href="__PAGE_URL__" />
    <link rel="icon" type="image/png" href="./favicon.png" />
  </head>
  <body>
    <div class="page">
      <div
        class="progress"
        id="progress-track"
        role="progressbar"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
        aria-valuetext="Not started"
        aria-label="Form progress"
      >
        <div class="progress__bar" id="progress"></div>
      </div>

      <header class="header">
        <a href="./" class="logo-link" aria-label="Criterion Real Estate home">
          <img
            class="logo"
            src="./criterion-logo.png"
            alt="Criterion Real Estate"
            width="1200"
            height="276"
          />
        </a>
      </header>

      <div class="hp" aria-hidden="true">
        <label for="company_website">Company website</label>
        <input type="text" id="company_website" name="company_website" tabindex="-1" autocomplete="off" />
      </div>

      <main class="main" id="main">
        <noscript>
          <p class="noscript">Turn on JavaScript to request your market analysis.</p>
        </noscript>
      </main>

      <footer class="footer">
        <div class="eho">
          <svg class="eho-icon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M3 15 16 4l13 11" />
            <path d="M7 12v16h18V12" />
            <path d="M11 17h10M11 22h10" />
          </svg>
          <span>Equal Housing Opportunity</span>
        </div>
        <p>Criterion Real Estate LLC, licensed in CT &amp; NY</p>
      </footer>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
