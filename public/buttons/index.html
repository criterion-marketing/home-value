<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Criterion Real Estate</title>
  <style>
    body{margin:0;font-family:-apple-system,"SF Pro Text",Inter,system-ui,sans-serif;background:#f6f6f7;color:#1d1d20;display:flex;min-height:100vh;min-height:100dvh;align-items:center;justify-content:center;text-align:center;padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));box-sizing:border-box;-webkit-text-size-adjust:100%}
    .c{max-width:360px}
    .e{font-size:56px;line-height:1}
    h1{font-size:1.35rem;margin:18px 0 8px;letter-spacing:-.02em}
    p{color:#6e6e76;font-size:.95rem;line-height:1.5;margin:6px 0}
    .b{margin-top:22px;font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:#6e6e76}
    a{color:#1d1d20}
  </style>
</head>
<body>
  <div class="c" id="root" role="status" aria-live="polite">
    <noscript>
      <h1>This link isn&rsquo;t working</h1>
      <p>Please go back to the list and try again, or call or text Daniel at <a href="tel:+12038982361">(203) 898-2361</a>.</p>
      <p class="b">Criterion Real Estate</p>
    </noscript>
  </div>
  <script>
  (function () {
    // Off-Google front door for the client sheet. Hits the public Apps Script
    // /exec URL with credentials omitted so iPhone users signed into several
    // Google accounts don't get "Sorry, unable to open the file at this time."
    // Same public web app as site.config.js leadEndpoint. It is not a secret.
    var EXEC = 'https://script.google.com/macros/s/AKfycbwcpeKoRHzPK2Vbdo5vTW_G8iIvSOhKQIMi0RbnQAMwPJZ39it3tr9JBRPZMmQCGHdS/exec';
    var params = new URLSearchParams(location.search);
    var action = String(params.get('action') || '').trim().toLowerCase();
    var root = document.getElementById('root');

    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function show(emoji, titleHtml, titleText, bodyHtml) {
      document.title = titleText + ' | Criterion Real Estate';
      root.innerHTML = (emoji ? '<div class="e">' + emoji + '</div>' : '') +
        '<h1>' + titleHtml + '</h1>' + bodyHtml +
        '<p class="b">Criterion Real Estate</p>';
    }
    function ping(url) {
      // credentials:omit is the point: do not send Google cookies.
      // no-cors + redirect:follow is required so iOS Safari can follow the
      // Apps Script 302 without a CORS failure. keepalive lets the GET finish
      // if the sheet tab is closed immediately. An Image or sendBeacon fallback
      // would send cookies and bring the multi-account error back.
      var opts = {
        method: 'GET',
        mode: 'no-cors',
        credentials: 'omit',
        redirect: 'follow',
        cache: 'no-store',
        referrerPolicy: 'no-referrer',
        keepalive: true
      };
      try {
        fetch(url, opts).catch(function () {});
      } catch (e) {
        try {
          opts.keepalive = false;
          fetch(url, opts).catch(function () {});
        } catch (e2) {}
      }
    }
    function broken() {
      show('', 'This link isn\u2019t working', 'This link isn\u2019t working',
        '<p>Please go back to the list and try again, or call or text Daniel at <a href="tel:+12038982361">(203) 898-2361</a>.</p>');
    }

    if (action !== 'like' && action !== 'refresh') {
      broken();
      return;
    }
    if (action === 'refresh') {
      ping(EXEC + '?action=refresh');
      show('\uD83D\uDD04', 'Got it! Your list is refreshing, check back in a few minutes.',
        'Got it! Your list is refreshing, check back in a few minutes.',
        '<p>You can close this tab and return to the sheet.</p>');
      return;
    }
    var id = params.get('id') || '';
    var addr = params.get('a') || '';
    // likePage_ records via a follow-up likehit beacon, not via action=like.
    ping(EXEC + '?action=likehit&id=' + encodeURIComponent(id) + '&a=' + encodeURIComponent(addr) +
      '&n=' + Math.random().toString(36).slice(2));
    var whereHtml = addr ? (' for <strong>' + esc(addr) + '</strong>') : '';
    var whereText = addr ? (' for ' + addr) : '';
    show('\uD83D\uDC4D', 'Saved! We\u2019ll email you the disclosures' + whereHtml + '.',
      'Saved! We\u2019ll email you the disclosures' + whereText + '.',
      '<p>You can close this tab and keep browsing the list.</p>');
  })();
  </script>
</body>
</html>
